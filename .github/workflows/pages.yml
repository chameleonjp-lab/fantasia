name: Publish Fantasia Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fantasia-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gate compares HEAD with the earlier accepted candidate.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-release-gate.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: BUILD_COMMIT=${{ github.sha }} node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
