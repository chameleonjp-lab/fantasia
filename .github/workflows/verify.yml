name: Verify Fantasia
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_acceptance:
        description: Run the preserved 34-screen, four-lever, and twelve-warning browser suites
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - id: browser
        name: Short UI-only real-DOM acceptance
        run: npm run test:browser
      - id: legacyBrowser
        name: Preserved 34-case gameplay and UI acceptance (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_browser_acceptance }}
        run: npm run test:browser:legacy-acceptance
      - name: Report clean-sheet acceptance (release remains blocked)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.full_browser_acceptance }}
        run: node --import tsx scripts/report-clean-acceptance.ts
      - id: throttle
        name: Four real-DOM lever integration cases
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.full_browser_acceptance }}
        run: npm run test:browser:throttle
      - name: Validate lever evidence and preserve original bytes in job log
        if: ${{ always() && steps.throttle.outcome != 'skipped' }}
        run: node --import tsx scripts/report-supplemental-acceptance.ts throttle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasia-verification
          path: test-results/
  active-critical:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_browser_acceptance }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - id: critical
        name: Twelve active-warning cases with 39 state observations
        run: npm run test:browser:active-critical
      - name: Validate warnings and index complete downloadable evidence
        if: always()
        run: node --import tsx scripts/report-supplemental-acceptance.ts active-critical
      - name: Preserve complete warning evidence for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasia-active-critical-verification
          path: supplemental-results/
          if-no-files-found: error
